<style>
:root{--a:#6ccf70;--d:#4fa855;--m:#16301c;--u:#0b1a10}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",Nunito,system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#w{width:min(100%,480px);padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px}
#sc{width:120px;height:25px;image-rendering:pixelated;align-self:flex-start}
#c{width:min(100%,calc((var(--tg-viewport-stable-height,100vh) - 200px)*.7692));aspect-ratio:800/1040;display:block}
#md{display:flex;gap:6px;width:100%}
#md button{flex:1;height:42px;border-radius:14px;border:2px solid #333;background:#1c1c1c;color:#aaa;font-size:14px;font-family:inherit;font-weight:bold;padding:0}
#md button.on{background:var(--a);border-color:var(--d);color:#000}
#ft{display:flex;width:100%;align-items:center;gap:8px}
#ft button{width:40px;height:40px;border-radius:12px;border:2px solid #333;background:#1c1c1c;color:#fff;font-size:16px;padding:0}
#ft div{flex:1}
#ft b{font-size:17px;display:block}
#ft small{color:#999;font-size:12px}
#ft span{text-align:right;color:#999;font-size:10px;letter-spacing:2px}
#ft span b{color:var(--a);font-size:20px;letter-spacing:0}
#lb{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;padding:14px 14px 20px;gap:8px;overflow:auto}
#lb[hidden]{display:none}
#lb>*{width:min(100%,460px)}
#lb h3{margin:0 0 4px;font-size:26px}
#lx{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:12px;border:2px solid #333;background:#1c1c1c;color:#fff;font-size:18px;padding:0}
.tb{display:flex;gap:6px}
.tb button{flex:1;height:40px;border-radius:14px;border:2px solid #333;background:#1c1c1c;color:#aaa;font-size:14px;font-family:inherit;font-weight:bold;padding:0}
.tb button.on{background:var(--a);border-color:var(--d);color:#000}
.sum,.r{display:flex;align-items:center;gap:10px;background:#161616;border-radius:18px;padding:12px 14px}
.sum{justify-content:space-between}.sum b{font-size:20px;display:block}.sum small{color:#999;font-size:12px}
.sum .st{text-align:center}.sum .st b{color:var(--a)}
.r.me{background:var(--m);color:var(--a)}
.k{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#999;flex:none}
.g1{background:#f2d04b;color:#000}.g2{background:#cfcfd4;color:#000}.g3{background:#c4895a;color:#000}
.av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#000;flex:none}
.n{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.sc{font-size:18px}
#hm{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;padding:16px 16px 0;z-index:5}
#hm[hidden]{display:none}
#hm h1{margin:6px 0 0;font-size:22px;text-align:center}
#fe{margin-top:auto}#fe h2{margin:0;font-size:30px}#fe p{margin:4px 0 14px;color:#999}
.bt{display:flex;gap:10px;margin-bottom:22px;position:relative}
.bt button{flex:1;height:64px;border-radius:20px;border:3px solid #333;background:#1c1c1c;color:#ccc;font:bold 20px inherit;font-family:inherit}
.bt .big{background:var(--a);border-color:var(--d);color:#000}
#bb{position:absolute;right:calc(25% - 34px);top:-26px;background:#fff;color:#000;border-radius:10px;padding:4px 10px;font-size:13px}
#cs{display:flex;gap:12px;overflow-x:auto;touch-action:pan-x;padding-bottom:14px}
.cd{flex:none;width:150px;height:190px;border-radius:24px;border:3px solid #222;background:#111;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;font-size:22px;font-weight:bold}
.cd small{font-size:13px;color:var(--a);font-weight:normal}.cd.off{opacity:.5}.cd.sel{border-color:var(--a)}
#nv{display:flex;border-top:1px solid #222;margin:0 -16px}
#nv button{flex:1;height:64px;background:none;border:0;color:#777;font:bold 17px inherit;font-family:inherit}
#nv button.on{color:#fff}
#ac{margin:auto 0;text-align:center;font-size:20px;line-height:2}
#un{position:fixed;inset:0;background:var(--u);z-index:6;display:flex;flex-direction:column;padding:14px;gap:10px}
#un[hidden],#up[hidden]{display:none}
.uh{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.uh button{height:40px;padding:0 14px;border-radius:12px;border:2px solid #333;background:#1c1c1c;color:#fff;font-family:inherit;font-weight:bold}
#ub{text-align:center}.ul{color:#9bb;margin-bottom:6px}
.uc2{flex:none;width:62px;height:92px;border-radius:10px;border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:bold;text-shadow:0 1px 2px #0008}
.bk{background:#222;font-size:13px}.bks{display:flex;justify-content:center}.bks .uc2{width:28px;height:42px;margin-left:-12px}
.dim{opacity:.4}.tp{transform:rotate(-6deg)}.cdot{width:24px;height:24px;border-radius:50%;border:2px solid #fff}
#um{flex:1;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;align-content:center}
#uk{display:flex;gap:8px;overflow-x:auto;touch-action:pan-x;padding:8px 2px 26px}
#up{display:flex;gap:12px;justify-content:center}#up button{width:56px;height:56px;border-radius:50%;border:3px solid #fff}
.big2{width:100%;height:50px;border-radius:16px;border:0;background:var(--a);font:bold 18px inherit;font-family:inherit}
.pv{flex:1;display:flex;align-items:center;justify-content:center;width:100%;position:relative;overflow:hidden}
.pv canvas{width:100%;height:100%;object-fit:contain}
#lby{position:fixed;inset:0;background:#000;z-index:7;display:flex;flex-direction:column;padding:16px;gap:10px;align-items:center;overflow:auto}
#lby[hidden]{display:none}#lby>*{width:min(100%,460px)}#lby h3{margin:0;font-size:26px;text-align:center}
#lby small{color:#999;text-align:center}.code{font-size:46px;font-weight:800;letter-spacing:8px;text-align:center;color:var(--a)}
.sec{height:44px;border-radius:12px;border:2px solid #333;background:#1c1c1c;color:#fff;font-size:20px;padding:0}
#jw{display:flex;gap:8px;margin-bottom:12px}#jw[hidden]{display:none}
#jw input{flex:1;min-width:0;height:44px;border-radius:12px;border:2px solid #333;background:#111;color:#fff;font-size:18px;padding:0 12px;user-select:text;-webkit-user-select:text}
#jw button{width:90px;height:44px;border-radius:12px;border:0;background:var(--a);color:#000;font-weight:800;font-family:inherit}
.sec2{height:46px;border-radius:14px;border:2px solid #333;background:#1c1c1c;color:#fff;font-family:inherit;font-weight:700;font-size:16px}
#lb{z-index:8}
.hh{display:flex;align-items:center;justify-content:space-between}.hh h1{margin:0}.hh>span{width:46px}
#gr,#sx{width:40px;height:40px;border-radius:12px;border:2px solid #333;background:#1c1c1c;color:#fff;font-size:20px;padding:0}
#st{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;padding:14px;gap:10px;align-items:center}
#st[hidden]{display:none}#st>*{width:min(100%,460px)}#st h3{margin:0;font-size:26px}#st label{color:#999;margin-top:10px}
#sx{position:absolute;top:10px;right:10px;width:40px}
#nbw[hidden]{display:none}#nbw{margin-bottom:12px}#nbw small{color:#999;display:block;margin-bottom:6px}
#ft span i{font-style:normal}
#ub{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.bx{padding:6px;border-radius:12px;border:2px solid transparent}.bx.act{border-color:var(--a)}
.bks .uc2{width:20px!important;height:30px!important;margin-left:-10px!important;font-size:0}
#hm .hh h1{font-size:28px;font-weight:800;letter-spacing:.5px}
.hh h1 .vx{color:var(--a)}
#gr{width:46px;height:46px;border-radius:50%;border:2px solid #2e2e2e;background:linear-gradient(#2c2c2c,#171717);color:var(--a);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 0 #ffffff14,0 4px 0 #0a0a0a,0 8px 14px #000c;transition:transform .15s,box-shadow .1s}
#gr:active{transform:translateY(3px) rotate(60deg);box-shadow:inset 0 2px 0 #ffffff14,0 1px 0 #0a0a0a}
.bt button{height:68px;border-radius:24px;border:0;font-family:inherit;font-weight:800;font-size:19px;letter-spacing:.4px;color:#eee;background:linear-gradient(#303030,#1b1b1b);box-shadow:inset 0 2px 0 #ffffff18,0 6px 0 #0a0a0a,0 14px 22px #000c;transition:transform .08s,box-shadow .08s}
.bt .big{color:#0a0a0a;background:linear-gradient(var(--a),var(--d));box-shadow:inset 0 2px 0 #ffffff66,0 6px 0 var(--d),0 14px 24px #000c}
.bt button:active{transform:translateY(5px);box-shadow:inset 0 2px 0 #ffffff18,0 1px 0 #0a0a0a,0 4px 8px #000c}
.bt .big:active{box-shadow:inset 0 2px 0 #ffffff66,0 1px 0 var(--d),0 4px 8px #000c}
</style>
</head>
<body>
<div id="w">
<canvas id="sc" width="120" height="25"></canvas>
<canvas id="c" width="800" height="1040"></canvas>
<div id="md"></div>
<div id="ft"><button id="hb">⌂</button><button id="pl">▶</button><div><b id="f1">Snake Game</b><small id="f2">Solo</small></div><button id="tp">🏆</button><span><i id="bl">BEST</i><b id="bs">0</b></span></div>
</div>
<div id="hm"><div class="hh"><span></span><h1 id="hh">Mar Games</h1><button id="gr"></button></div>
<div id="g1" style="display:flex;flex-direction:column;flex:1"><div id="fe"><h2>Snake Game</h2><p>Eat, grow and don't bite your tail.</p></div>
<div id="nbw" hidden><small id="nl"></small><div class="tb" id="nb"></div></div>
<div id="jw" hidden><input id="jc" maxlength="8" autocapitalize="off" autocomplete="off"><button id="jb"></button></div>
<div class="bt"><button class="big" id="ps">Play solo</button><button id="hl">🏆 Leaderboard</button><span id="bb"></span></div>
<div id="cs"></div></div>
<div id="ac" hidden><div id="at"></div></div>
<div id="nv"><button class="on" id="n1">Games</button><button id="n2">Activity</button></div></div>
<div id="st" hidden><button id="sx">✕</button><h3 id="sh">Settings</h3><label id="l1"></label><div class="tb" id="sl"></div><label id="l2"></label><div class="tb" id="sth"></div></div>
<div id="lby" hidden></div>
<div id="un" hidden><div class="uh"><button id="ux">‹ Home</button><span id="us"></span></div><div id="ub"></div><div id="um"></div><div id="up" hidden></div><div id="uk"></div></div>
<div id="lb" hidden><button id="lx">✕</button><h3 id="lh">Leaderboard</h3><div class="tb" id="lt"></div><div class="tb" id="lm"></div><div id="lr"></div></div>
<script>
const $=i=>document.getElementById(i),c=$('c'),g=c.getContext('2d'),sg=$('sc').getContext('2d');
const CO=18,RO=24,Z=40,M=40,W=800,H=1040;let COL='#6ccf70';
const DG=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001001001001','111101111101111','111101111001111'];
let inG=0,sn,d,nd,q,fd,pt,ov=0,ovt=0,run=0,md=0,best=0,ls=0,lt=null;
const TG=window.Telegram&&window.Telegram.WebApp;
if(TG){try{TG.ready();TG.expand();TG.disableVerticalSwipes();TG.setBackgroundColor('#000000');TG.setHeaderColor('#000000')}catch(e){}}
try{best=+localStorage.sb||0}catch(e){}
$('bs').textContent=best;
function hp(k){try{k?TG.HapticFeedback.notificationOccurred('error'):TG.HapticFeedback.impactOccurred('light')}catch(e){}}
function sync(i,cb){try{TG.Serverless.call('sync',i,(e,r)=>cb&&cb(e,r))}catch(e){cb&&cb(e)}}
function ab(r){if(r&&r.overall&&r.overall.best>best){best=r.overall.best;$('bs').textContent=best}}
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let lp='daily',lm=0,lc=null;
function row(t){const r=E('div','r'+(t.me?' me':'')),k=E('span','k'+(t.rank<4?' g'+t.rank:''),t.rank),a=E('span','av',(t.name||'?')[0].toUpperCase());
a.style.background=['#e8584a','#6ccf70','#f2d04b','#5aa9e6','#b784e0'][(t.name||'?').charCodeAt(0)%5];
r.append(k,a,E('span','n',t.name),E('span','sc',t.score.toLocaleString()));return r}
function lrender(){const o=$('lr');o.textContent='';
if(lc===0){o.textContent='...';return}
const r=lc&&lc[lp];if(!r){o.textContent=_('soon');return}
const sm=E('div','sum'),a=E('div'),b=E('div','st'),c=E('div','st');
a.append(E('b','',_('snake')),E('small','',lp=='daily'?_('every'):_('all')));
b.append(E('b','','#'+(r.rank||'-')),E('small','',_('you')));c.append(E('b','',r.players),E('small','',_('players')));
sm.append(a,b,c);o.append(sm);
r.top.forEach(t=>o.append(row(t)));
if(r.rank>10)o.append(row({rank:r.rank,name:_('youn'),score:r.best,me:1}))}
function lload(){lc=0;lrender();sync({mode:lm},(e,r)=>{lc=e?null:r;if(!e)ab(r);lrender()})}
function tabs(id,names,get,set){const o=$(id);o.textContent='';names.forEach((t,i)=>{const b=E('button',get()==i?'on':'',t);b.onclick=()=>{set(i);tabs(id,names,get,set)};o.appendChild(b)})}
function ltabs(){tabs('lt',[_('daily'),_('overall')],()=>lp=='daily'?0:1,i=>{lp=i?'overall':'daily';lrender()});
tabs('lm',[_('nw'),_('w'),_('adv')],()=>lm,i=>{lm=i;lload()})}
$('tp').onclick=()=>{lm=md;$('lb').hidden=false;ltabs();lload()};
$('lx').onclick=()=>{$('lb').hidden=true};
function mark(){[...$('md').children].forEach((b,i)=>b.className=i==md?'on':'')}
$('pl').onclick=()=>init();
function init(){sn=[{x:9,y:12},{x:8,y:12},{x:7,y:12}];lt={x:6,y:12};d=nd={x:1,y:0};q=[];pt=0;ov=0;run=0;place();sco()}
function place(){do fd={x:Math.random()*CO|0,y:Math.random()*RO|0};while(sn.some(s=>s.x==fd.x&&s.y==fd.y))}
const sp=()=>md>1?Math.max(60,100-pt*.2):100;
function go(a,b){if(!inG)return;if(ov){if(Date.now()-ovt<600)return;init()}
const l=q.length?q[q.length-1]:d;if((a==l.x&&b==l.y)||(a==-l.x&&b==-l.y))return;
if(q.length<2)q.push({x:a,y:b});const n=performance.now();if(!run){run=1;ls=n-sp()}else if(q.length==1&&n-ls>=sp()*.45)step(n)}
function die(){ov=1;ovt=Date.now();run=0;hp(1);
if(pt>best){best=pt;$('bs').textContent=best;try{localStorage.sb=best}catch(e){}}
sync({mode:md,score:pt},(e,r)=>{if(!e)ab(r)})}
function step(n){if(q.length)nd=q.shift();d=nd;let x=sn[0].x+d.x,y=sn[0].y+d.y;
if(md){if(x<0||y<0||x>=CO||y>=RO)return die()}else{x=(x+CO)%CO;y=(y+RO)%RO}
const a=x==fd.x&&y==fd.y;
if((a?sn:sn.slice(0,-1)).some(s=>s.x==x&&s.y==y))return die();
sn.unshift({x,y});if(a){pt+=10;lt=null;place();sco();hp(0)}else lt=sn.pop();ls=n}
function sco(){sg.clearRect(0,0,120,25);sg.fillStyle=COL;
String(pt).padStart(6,'0').split('').forEach((n,i)=>{const p=DG[n];
for(let r=0;r<5;r++)for(let k=0;k<3;k++)if(p[r*3+k]=='1')sg.fillRect((i*4+k)*5,r*5,4,4)})}
const wx=v=>v>CO/2?v-CO:v<-CO/2?v+CO:v,wy=v=>v>RO/2?v-RO:v<-RO/2?v+RO:v;
function bp(p){const u=[{x:sn[0].x,y:sn[0].y}];
for(let i=1;i<sn.length;i++)u.push({x:u[i-1].x+wx(sn[i].x-sn[i-1].x),y:u[i-1].y+wy(sn[i].y-sn[i-1].y)});
const l=u[u.length-1],h={x:u[0].x-d.x*(1-p),y:u[0].y-d.y*(1-p)};let t=l;
if(lt){const e=sn[sn.length-1],a=l.x+wx(lt.x-e.x),b=l.y+wy(lt.y-e.y);t={x:a+(l.x-a)*p,y:b+(l.y-b)*p}}
return[h,...u.slice(1),t]}
function drawSnake(P){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
for(const o of P){x0=Math.min(x0,o.x);x1=Math.max(x1,o.x);y0=Math.min(y0,o.y);y1=Math.max(y1,o.y)}
g.save();g.beginPath();g.rect(M,M,CO*Z,RO*Z);g.clip();g.lineCap=g.lineJoin='round';g.setLineDash([]);
for(let j=-1;j<2;j++)for(let i=-1;i<2;i++){
if(x1+i*CO<-1||x0+i*CO>CO||y1+j*RO<-1||y0+j*RO>RO)continue;
const f=o=>[(o.x+i*CO+.5)*Z+M,(o.y+j*RO+.5)*Z+M];
const path=()=>{g.beginPath();P.forEach((o,k)=>{const[a,b]=f(o);k?g.lineTo(a,b):g.moveTo(a,b)})};
g.strokeStyle=COL;g.lineWidth=Z*.5;path();g.stroke();
g.strokeStyle='#ffffff30';g.lineWidth=Z*.14;path();g.stroke();
const[hx,hy]=f(P[0]);g.fillStyle=COL;g.beginPath();g.arc(hx,hy,Z*.32,0,7);g.fill();
g.fillStyle='#000';
for(const s of[-1,1]){g.beginPath();g.arc(hx+d.x*Z*.08-d.y*s*Z*.15,hy+d.y*Z*.08+d.x*s*Z*.15,Z*.07,0,7);g.fill()}}
g.restore()}
function render(n){const p=run?Math.min(1,(n-ls)/sp()):1;
g.fillStyle='#000';g.fillRect(0,0,W,H);
g.strokeStyle=COL;g.lineWidth=8;g.setLineDash(md?[]:[10,12]);g.strokeRect(M-18,M-18,CO*Z+36,RO*Z+36);
const s=1+Math.sin(n/200)*.08;g.save();g.translate(M+fd.x*Z+Z/2,M+fd.y*Z+Z/2);g.scale(s,s);g.fillStyle='#ffd166';
[[0,0],[-1,0],[1,0],[0,-1],[0,1]].forEach(([a,b])=>g.fillRect(a*Z*.26-Z*.13,b*Z*.26-Z*.13,Z*.26,Z*.26));g.restore();
drawSnake(bp(p));
if(!run){g.textAlign='center';g.fillStyle=COL;g.font='120px sans-serif';g.fillText('✥',W/2,H/2-60);
g.font='bold 68px "Arial Rounded MT Bold",Arial,sans-serif';g.fillText(ov?_('over'):_('start'),W/2,H/2+60);
if(ov){g.font='bold 40px Arial,sans-serif';g.fillText(_('rest'),W/2,H/2+132)}}}
function loop(n){requestAnimationFrame(loop);if(run&&n-ls>=sp())step(n);render(n)}
let tx,ty,on=0;
function pos(e){return e.touches?e.touches[0]:e}
function ts(e){if(e.target.closest('button,#lb'))return;const p=pos(e);tx=p.clientX;ty=p.clientY;on=1}
function tmv(e){if(!on||!inG)return;e.preventDefault();const p=pos(e),a=p.clientX-tx,b=p.clientY-ty,x=Math.abs(a),y=Math.abs(b);
if(Math.max(x,y)>20&&(x>y*1.5||y>x*1.5)){if(x>y)go(a>0?1:-1,0);else go(0,b>0?1:-1);tx=p.clientX;ty=p.clientY}}
document.addEventListener('touchstart',ts,{passive:false});
document.addEventListener('touchmove',tmv,{passive:false});
document.addEventListener('touchend',()=>on=0);
document.addEventListener('mousedown',ts);
document.addEventListener('mousemove',tmv);
