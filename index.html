<script>
const $=i=>document.getElementById(i),c=$('c'),g=c.getContext('2d'),sg=$('sc').getContext('2d');
const CO=18,RO=24,Z=40,M=40,W=800,H=1040;let COL='#6ccf70';
const DG=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001001001001','111101111101111','111101111001111'];
let gw=0,inG=0,sn,d,nd,q,fd,pt,ov=0,ovt=0,run=0,md=0,best=0,ls=0,lt=null;
const TG=window.Telegram&&window.Telegram.WebApp;
if(TG){try{TG.ready();TG.expand();TG.disableVerticalSwipes();TG.setBackgroundColor('#000000');TG.setHeaderColor('#000000')}catch(e){}try{TG.setBottomBarColor('#000000')}catch(e){}}
try{best=+localStorage.sb||0}catch(e){}
$('bs').textContent=best;
function hs(){if(!vib)return;try{TG.HapticFeedback.selectionChanged()}catch(e){}}
function hp(k){if(!vib)return;try{k?TG.HapticFeedback.notificationOccurred('error'):TG.HapticFeedback.impactOccurred('light')}catch(e){}}
function sync(i,cb){try{TG.Serverless.call('sync',i,(e,r)=>cb&&cb(e,r))}catch(e){cb&&cb(e)}}
function ab(r){if(r&&r.overall&&r.overall.best>best){best=r.overall.best;$('bs').textContent=best}}
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let lp='daily',lm=0,lc=null;
function row(t){const r=E('div','r'+(t.me?' me':'')),k=E('span','k'+(t.rank<4?' g'+t.rank:''),t.rank),a=E('span','av',(t.name||'?')[0].toUpperCase());
a.style.background=['#e8584a','#6ccf70','#f2d04b','#5aa9e6','#b784e0'][(t.name||'?').charCodeAt(0)%5];
r.append(k,a,E('span','n',t.name),E('span','sc',t.score.toLocaleString()));return r}
function lrender(){const o=$('lr');o.textContent='';
if(lc===0){o.textContent='...';return}
const r=lc&&lc[lp];if(!r){o.textContent=_('soon');return}
const sm=E('div','sum'),a=E('div'),b=E('div','st'),c=E('div','st');
a.append(E('b','',_('snake')),E('small','',lp=='daily'?_('every'):_('all')));
b.append(E('b','','#'+(r.rank||'-')),E('small','',_('you')));c.append(E('b','',r.players),E('small','',_('players')));
sm.append(a,b,c);o.append(sm);
r.top.forEach(t=>o.append(row(t)));
if(r.rank>10)o.append(row({rank:r.rank,name:_('youn'),score:r.best,me:1}))}
function lload(){lc=0;lrender();sync({mode:lm},(e,r)=>{lc=e?null:r;if(!e)ab(r);lrender()})}
function tabs(id,names,get,set){const o=$(id);o.textContent='';names.forEach((t,i)=>{const b=E('button',get()==i?'on':'',t);b.onclick=()=>{set(i);tabs(id,names,get,set)};o.appendChild(b)})}
function ltabs(){tabs('lt',[_('daily'),_('overall')],()=>lp=='daily'?0:1,i=>{lp=i?'overall':'daily';lrender()});
tabs('lm',[_('nw'),_('w'),_('adv')],()=>lm,i=>{lm=i;lload()})}
$('tp').onclick=()=>{lm=md;$('lb').hidden=false;ltabs();lload()};
$('lx').onclick=()=>{$('lb').hidden=true};
function mark(){[...$('md').children].forEach((b,i)=>b.className=i==md?'on':'')}
$('pl').onclick=()=>init();
function init(){$('go').hidden=true;sn=[{x:9,y:12},{x:8,y:12},{x:7,y:12}];lt={x:6,y:12};d=nd={x:1,y:0};q=[];pt=0;gw=0;ov=0;run=0;place();sco()}
function place(){do fd={x:Math.random()*CO|0,y:Math.random()*RO|0};while(sn.some(s=>s.x==fd.x&&s.y==fd.y))}
const sp=()=>md>1?Math.max(60,100-pt*.25):100;
function go(a,b){if(!inG||ov)return;
const l=q.length?q[q.length-1]:d;if((a==l.x&&b==l.y)||(a==-l.x&&b==-l.y))return;
if(q.length<2){q.push({x:a,y:b});hs()}const n=performance.now();if(!run){run=1;ls=n-sp()}else if(q.length==1&&n-ls>=sp()*.45)step(n)}
function die(){const pb=best;ov=1;ovt=Date.now();run=0;hp(1);addH({g:'snake',m:md,s:pt});endEv('snake',{win:0,rec:pt>pb&&pt>0});
if(pt>best){best=pt;$('bs').textContent=best;try{localStorage.sb=best}catch(e){}}
sync({mode:md,score:pt},(e,r)=>{if(!e)ab(r)});setTimeout(()=>showGO(pb),400);if(inAr)arenaScore(pt)}
function step(n){if(q.length)nd=q.shift();d=nd;let x=sn[0].x+d.x,y=sn[0].y+d.y;
if(md){if(x<0||y<0||x>=CO||y>=RO)return die()}else{x=(x+CO)%CO;y=(y+RO)%RO}
const a=x==fd.x&&y==fd.y,gr=a&&gw+.6>=1;
if((gr?sn:sn.slice(0,-1)).some(s=>s.x==x&&s.y==y))return die();
sn.unshift({x,y});if(a){pt+=8;gw+=.6;place();sco();hp(0);if(gr){gw-=1;lt=null}else lt=sn.pop()}else lt=sn.pop();ls=n}
function sco(){sg.clearRect(0,0,120,25);sg.fillStyle=COL;
String(pt).padStart(6,'0').split('').forEach((n,i)=>{const p=DG[n];
for(let r=0;r<5;r++)for(let k=0;k<3;k++)if(p[r*3+k]=='1')sg.fillRect((i*4+k)*5,r*5,4,4)})}
const wx=v=>v>CO/2?v-CO:v<-CO/2?v+CO:v,wy=v=>v>RO/2?v-RO:v<-RO/2?v+RO:v;
function bp(p){const u=[{x:sn[0].x,y:sn[0].y}];
for(let i=1;i<sn.length;i++)u.push({x:u[i-1].x+wx(sn[i].x-sn[i-1].x),y:u[i-1].y+wy(sn[i].y-sn[i-1].y)});
const l=u[u.length-1],h={x:u[0].x-d.x*(1-p),y:u[0].y-d.y*(1-p)};let t=l;
if(lt){const e=sn[sn.length-1],a=l.x+wx(lt.x-e.x),b=l.y+wy(lt.y-e.y);t={x:a+(l.x-a)*p,y:b+(l.y-b)*p}}
return[h,...u.slice(1),t]}
function drawSnake(P){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
for(const o of P){x0=Math.min(x0,o.x);x1=Math.max(x1,o.x);y0=Math.min(y0,o.y);y1=Math.max(y1,o.y)}
g.save();g.beginPath();g.rect(M,M,CO*Z,RO*Z);g.clip();g.lineCap=g.lineJoin='round';g.setLineDash([]);
for(let j=-1;j<2;j++)for(let i=-1;i<2;i++){
if(x1+i*CO<-1||x0+i*CO>CO||y1+j*RO<-1||y0+j*RO>RO)continue;
const f=o=>[(o.x+i*CO+.5)*Z+M,(o.y+j*RO+.5)*Z+M];
const path=()=>{g.beginPath();P.forEach((o,k)=>{const[a,b]=f(o);k?g.lineTo(a,b):g.moveTo(a,b)})};
const SKN=SK[PR.eq.sk]||SK.classic,rb=SKN.c=='rainbow',c1=SKN.c&&!rb?SKN.c[0]:COL,c2=SKN.c&&!rb?SKN.c[1]+'90':'#ffffff30',hh=x=>'hsl('+((x+performance.now()/18)%360)+',80%,60%)';
g.lineWidth=Z*.5;
if(rb){for(let k=0;k<P.length-1;k++){g.beginPath();let[a,b]=f(P[k]);g.moveTo(a,b);[a,b]=f(P[k+1]);g.lineTo(a,b);g.strokeStyle=hh(k*26);g.stroke()}}else{g.strokeStyle=c1;path();g.stroke()}
g.strokeStyle=c2;g.lineWidth=Z*.14;path();g.stroke();
const[hx,hy]=f(P[0]);g.fillStyle=rb?hh(0):c1;g.beginPath();g.arc(hx,hy,Z*.32,0,7);g.fill();
g.fillStyle='#000';
for(const s of[-1,1]){g.beginPath();g.arc(hx+d.x*Z*.08-d.y*s*Z*.15,hy+d.y*Z*.08+d.x*s*Z*.15,Z*.07,0,7);g.fill()}}
g.restore()}
function render(n){const p=run?Math.min(1,(n-ls)/sp()):1;
g.fillStyle='#000';g.fillRect(0,0,W,H);
g.strokeStyle=COL;g.lineWidth=8;g.setLineDash(md?[]:[10,12]);g.strokeRect(M-18,M-18,CO*Z+36,RO*Z+36);
const s=1+Math.sin(n/200)*.08;g.save();g.translate(M+fd.x*Z+Z/2,M+fd.y*Z+Z/2);g.scale(s,s);g.fillStyle='#ffd166';
[[0,0],[-1,0],[1,0],[0,-1],[0,1]].forEach(([a,b])=>g.fillRect(a*Z*.26-Z*.13,b*Z*.26-Z*.13,Z*.26,Z*.26));g.restore();
drawSnake(bp(p));
if(!run&&!ov){g.textAlign='center';g.fillStyle=COL;g.font='120px sans-serif';g.fillText('✥',W/2,H/2-60);
g.font='bold 68px "Arial Rounded MT Bold",Arial,sans-serif';g.fillText(ov?_('over'):_('start'),W/2,H/2+60);
if(ov){g.font='bold 40px Arial,sans-serif';g.fillText(_('rest'),W/2,H/2+132)}}}
function loop(n){requestAnimationFrame(loop);if(run&&n-ls>=sp())step(n);render(n)}

function deal(){hands=[[],[],[],[]];let d=deck();for(let i=0;i<52;i++)hands[i%4].push(d[i]);hands.forEach(h=>h.sort((a,b)=>suits.indexOf(a.s)-suits.indexOf(b.s)||ranks.indexOf(a.r)-ranks.indexOf(b.r)));plays=[];tricks=[0,0];trickNo=0;lead=null;turn=0;started=true}
function cardHTML(c,i,handCard){let e=document.createElement('div');e.className='hkcard'+(red(c.s)?' red':'')+(handCard&&legal(c)?' playable':'');e.innerHTML='<span>'+c.r+c.s+'</span><span class="pip">'+c.s+'</span><span class="corner2">'+c.r+c.s+'</span>';e.dataset.i=i;if(handCard){e.addEventListener('pointerdown',ev=>down(ev,e,i,c));}return e}
function legal(c){return !lead||c.s===lead||!hands[turn].some(x=>x.s===lead)}
function draw(){if(!started)return;$h('hkstatus').textContent=`دور ${names[turn]} · حکم ${trump} · امتیاز ${tricks[0]} - ${tricks[1]}`;$h('hkhand').innerHTML='';hands[0].forEach((c,i)=>$h('hkhand').append(cardHTML(c,i,true)));
for(let p=0;p<4;p++){let seat=$h('hks'+p);seat.querySelector('b').textContent=names[p]+(p===turn?' ◉':'');seat.classList.toggle('active',p===turn);let backs=seat.querySelector('.backs');backs.innerHTML='';for(let k=0;k<hands[p].length;k++){let b=document.createElement('i');b.className='hkback';backs.append(b)}}
$h('hkcenter').innerHTML='';plays.forEach(x=>$h('hkcenter').append(cardHTML(x.c,x.p,false)));$h('hkfoot').innerHTML='';
if(mode==='friends'&&host){let b=document.createElement('button');b.className='hkbtn';b.textContent='کد اتاق: '+room+' · کپی';b.onclick=()=>navigator.clipboard?.writeText(room);$h('hkfoot').append(b)}
}
function down(ev,el,i,c){if(turn!==0||mode==='friends'&&!host||!legal(c))return;ev.preventDefault();drag={el,i,c,x:ev.clientX,y:ev.clientY};el.classList.add('dragging');el.setPointerCapture(ev.pointerId);el.onpointermove=e=>{if(drag){el.style.transform=`translate(${e.clientX-drag.x}px,${e.clientY-drag.y}px) scale(1.12) rotate(4deg)`}};el.onpointerup=e=>{if(!drag)return;let r=$h('hktable').getBoundingClientRect();let inside=e.clientY>r.top&&e.clientY<r.bottom;el.onpointermove=el.onpointerup=null;drag=null;if(inside)play(0,i);else{el.classList.remove('dragging');el.style.transform=''}}}
function play(p,i){if(!started||p!==turn)return;let c=hands[p][i];if(!c||!legal(c))return;if(!lead)lead=c.s;hands[p].splice(i,1);plays.push({p,c});turn=(turn+1)%4;draw();if(plays.length===4)setTimeout(resolveTrick,700);else if(mode==='solo')setTimeout(botTurn,550);else if(host)broadcast()}
function strength(c){return (c.s===trump?100: c.s===lead?50:0)+ranks.indexOf(c.r)}
function resolveTrick(){let winner=plays.reduce((a,b)=>strength(a.c)>strength(b.c)?a:b).p;tricks[winner%2]++;trickNo++;plays=[];lead=null;turn=winner;draw();if(tricks[0]>=7||tricks[1]>=7||trickNo===13){started=false;modal(tricks[0]>tricks[1]?'بردی! 🎉':'این دست رو باختی','نتیجه: تیم شما '+tricks[0]+' · حریف '+tricks[1],[['دوباره بازی',()=>startSolo(),true],['خانه',()=>menu()]])}else if(mode==='solo')botTurn();else if(host)broadcast()}
function botTurn(){if(!started||mode!=='solo'||turn===0)return;let h=hands[turn],ix=h.findIndex(legal);if(ix<0)ix=0;play(turn,ix)}
function createRoom(){if(typeof Peer==='undefined'){modal('اتصال در دسترس نیست','کتابخانه PeerJS بارگذاری نشده است.',[['برگشت',menu]]);return}room=rnd();host=true;mode='friends';peer=new Peer('gvhokm-'+room);modal('ساخت اتاق','کد اتاق: '+room+'؛ این کد را برای سه دوستت بفرست.',[['شروع با بات‌های جایگزین',()=>{startSolo();mode='friends';host=true}],['برگشت',menu]]);peer.on('connection',c=>{conn=c;c.on('data',d=>{if(d.action==='card'&&started)play(d.player,d.index)});c.on('open',()=>{})});peer.on('error',()=>modal('خطای اتصال','این کد اتاق اشغال است. دوباره بساز.',[['تلاش دوباره',createRoom],['برگشت',menu]]))}
function joinPrompt(){modal('ورود به اتاق','کد اتاق را وارد کن.',[['لغو',menu]]);let input=document.createElement('input');input.maxLength=4;input.placeholder='AB12';$h('hkpanel').append(input);let b=document.createElement('button');b.className='hkbtn primary';b.textContent='اتصال';b.onclick=()=>{room=input.value.toUpperCase();if(typeof Peer==='undefined')return;peer=new Peer();peer.on('open',()=>{conn=peer.connect('gvhokm-'+room,{reliable:true});conn.on('open',()=>modal('وصل شدی','منتظر میزبان بمان.',[['باشه',closeModal,true]]));conn.on('data',d=>{if(d.state){hands=d.state.hands;plays=d.state.plays;turn=d.state.turn;trump=d.state.trump;tricks=d.state.tricks;started=true;draw()}})})};$h('hkpanel').append(b)}
function broadcast(){if(!host||!peer)return;peer.connections&&Object.values(peer.connections).flat().forEach(c=>{if(c.open)c.send({state:{hands,plays,turn,trump,tricks}})})}
$h('hkback').onclick=()=>menu();$h('hkhelp').onclick=()=>modal('قانون کوتاه','خال حکم از بقیه خال‌ها قوی‌تر است. باید از خال شروع‌شده پیروی کنی اگر کارت آن خال را داری. هر تیم با بردن ۷ دست، راند را می‌برد.',[['متوجه شدم',()=>{if(started)draw();else menu()},true]]);
$h('hksolo').onclick=startSolo;$h('hkfriends').onclick=createRoom;$h('hkjoin').onclick=joinPrompt;$h('hkclose').onclick=()=>{$h('hk').hidden=true;$h('hm').hidden=false};
const old=cbuild;cbuild=function(){old();let tile=document.createElement('div');tile.className='cd';tile.style.borderColor='#d6b65b';tile.innerHTML='<div class="pv" style="font-size:48px;align-items:center;justify-content:center">🂡</div><span>حُکم</span><small>بازی چهار نفره</small>';tile.onclick=show;$('cs').append(tile)};
})();
</script>
